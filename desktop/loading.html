<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TaskFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg: #f1f6ff; --ink: #1f1b4d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14122e; --ink: #f1f0ff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 600 17px -apple-system, "Be Vietnam Pro", system-ui, sans-serif; }
  body { display: grid; place-content: center; justify-items: center; gap: 22px; }
  svg { width: 96px; height: 108px; overflow: visible; animation: bob 1.6s ease-in-out infinite; }
  .shadow { fill: currentColor; opacity: .15; transform-origin: 50% 50%; animation: shade 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  @keyframes shade { 50% { transform: scaleX(.8); opacity: .1; } }
  @media (prefers-reduced-motion: reduce) { svg, .shadow { animation: none; } }
</style>
</head>
<body>
  <svg viewBox="0 0 32 40" aria-hidden="true">
    <ellipse class="shadow" cx="16" cy="37" rx="9" ry="1.6"/>
    <path d="M16 3C21 11 28 17 28 24c0 6-5 9-12 9S4 30 4 24C4 17 11 11 16 3z" fill="#ff8a3d" stroke="#1f1b4d" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M10.8 21c.4-2.7 1.8-4.7 3.4-6.4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="25" r="1.8" fill="#1f1b4d"/><circle cx="20" cy="25" r="1.8" fill="#1f1b4d"/>
  </svg>
  <div id="m" role="status">TaskFlow</div>
  <script>document.getElementById('m').textContent = new URLSearchParams(location.search).get('m') || 'TaskFlow';</script>
</body>
</html>
