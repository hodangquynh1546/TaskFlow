# `docker compose up -d --wait` starts only PostgreSQL (local development).
# The full stack is opt-in: `docker compose --profile app up -d --build` (see docs/architecture/deployment.md).
# Values come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      Jwt__Issuer: ${Jwt__Issuer:-TaskFlow}
      Jwt__Audience: ${Jwt__Audience:-TaskFlow.Client}
      Jwt__ExpiresMinutes: ${Jwt__ExpiresMinutes:-60}
      Jwt__RefreshDays: ${Jwt__RefreshDays:-90}
      # Only the web container can reach this service (no published port), so trusting the compose network is safe.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    profiles: ["app"]
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

volumes:
  taskflow-pgdata:
