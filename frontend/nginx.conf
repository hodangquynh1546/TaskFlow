# Serves the Angular build and proxies /api to the backend on the same origin (ADR-15).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers get these on every response. Tokens live in localStorage (ADR-06), so the CSP is the main XSS mitigation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite rather than append: this proxy is the edge, so a client-supplied X-Forwarded-For must not survive.
        # Behind another load balancer, restore the real client IP with set_real_ip_from/real_ip_header (docs/architecture/deployment.md).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change, so they can be cached for good; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The stock mime table has no entry for .webmanifest; browsers expect application/manifest+json for the install manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
